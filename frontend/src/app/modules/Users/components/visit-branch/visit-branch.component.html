<div class="min-vh-100 d-flex align-items-center justify-content-center bg-dark py-5">
  <div class="text-center px-3" style="max-width: 600px; width: 100%;">

    <!-- Icon -->
    <div class="mx-auto mb-4 rounded-circle d-flex align-items-center justify-content-center"
         style="width:80px; height:80px; background:rgba(255,193,7,0.15); border: 1px solid rgba(255,193,7,0.4);">
      <i class="fa-solid fa-location-dot fa-2x text-warning"></i>
    </div>

    <!-- Title -->
    <h2 class="fw-bold text-white mb-2">Visit Branch</h2>
    <p class="text-secondary mb-4">
      <span class="text-warning fw-semibold">SmartGym</span> Visit Branch to complete your 
      <span class="text-warning fw-semibold">InBody scan</span>. Our staff will guide you!
    </p>

    <!-- Steps -->
    <div class="text-start rounded-3 p-4 mb-4"
         style="background:rgba(255,255,255,0.04); border: 1px solid rgba(255,193,7,0.15);">

      <div class="d-flex gap-3 mb-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center"
             style="width:36px; height:36px; background:#FFC107; color:#111; font-weight:700;">1</div>
        <div>
          <p class="text-white fw-semibold mb-0">Find the branch</p>
          <p class="text-secondary small mb-0">Use the map below</p>
        </div>
      </div>

      <div class="d-flex gap-3 mb-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center"
             style="width:36px; height:36px; background:#FFC107; color:#111; font-weight:700;">2</div>
        <div>
          <p class="text-white fw-semibold mb-0">Do your InBody scan</p>
          <p class="text-secondary small mb-0">Takes 5 minutes</p>
        </div>
      </div>

      <div class="d-flex gap-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center"
             style="width:36px; height:36px; background:#FFC107; color:#111; font-weight:700;">3</div>
        <div>
          <p class="text-white fw-semibold mb-0">Come back to app</p>
          <p class="text-secondary small mb-0">Results ready instantly</p>
        </div>
      </div>

    </div>

    <!-- Map -->
    <div class="rounded-3 mb-4 overflow-hidden"
         style="height: 220px; border: 1px solid rgba(255,193,7,0.2);">
      <iframe
        src="https://www.openstreetmap.org/export/embed.html?bbox=31.22%2C30.03%2C31.26%2C30.06&layer=mapnik&marker=30.0444%2C31.2357"
        width="100%" height="100%"
        style="border:0; filter: grayscale(60%) invert(85%) contrast(1.1);"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Button -->
    <button class="btn btn-warning fw-bold px-5 py-2 rounded-pill"
            (click)="goToInBody()"
            [disabled]="loading">

      @if (loading) {
        Checking...
      } @else {
        <i class="fa-solid fa-circle-check me-2"></i>
        I've Done My InBody Scan!
      }

    </button>

    <!-- Error -->
    @if (errorMsg) {
      <div class="alert mt-3 rounded-3"
           style="background:rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3); color:#ff6b7a;">
        {{ errorMsg }}
      </div>
    }

    <p class="text-secondary small mt-3">
      Click above after finishing your scan
    </p>

  </div>
</div>
