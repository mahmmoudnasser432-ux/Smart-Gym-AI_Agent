<div class="min-vh-100 d-flex align-items-center justify-content-center bg-dark py-5">
  <div class="card border-0 shadow-lg p-4 p-md-5 text-center" 
       style="max-width:520px; width:100%; background:rgba(255,255,255,0.05); border-radius:20px;">

    <div class="mx-auto mb-4 rounded-circle d-flex align-items-center justify-content-center"
         style="width:70px; height:70px; background:rgba(255,193,7,0.15);">
      <i class="fa-solid fa-dumbbell fa-xl text-warning"></i>
    </div>

    <h2 class="fw-bold text-white mb-3">Ready to Know Your Body?</h2>

    <p class="text-secondary mb-4">
      InBody scan gives accurate body composition for AI plan
    </p>

    <p class="text-white fw-semibold fs-5 mb-4">
      Do you want to do an InBody scan?
    </p>

    <!-- ✅ زرار واحد بس -->
    <button class="btn btn-warning fw-bold px-4 py-2 rounded-pill"
            (click)="goToVisitBranch()">
      Yes, Let's Go!
    </button>

  </div>
</div>
