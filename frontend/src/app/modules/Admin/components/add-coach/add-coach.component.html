<div class="add-coach-container">
  <!-- Header -->
  <div class="page-header">
    <div class="header-content">
      <button class="back-button" (click)="goBack()">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div>
        <h1 class="page-title">Add New Coach</h1>
        <p class="page-subtitle">Fill in the coach's basic information</p>
      </div>
    </div>
  </div>

  <!-- Form Container -->
  <div class="form-container">
    <form (ngSubmit)="onSubmit()" class="coach-form">

      <!-- Photo Upload Section -->
      <div class="upload-section">
        <div class="upload-box">
          <input
            type="file"
            #fileInput
            (change)="onFileSelected($event)"
            accept="image/jpeg,image/png,image/webp"
            style="display: none;">

          <div class="preview-area" (click)="fileInput.click()" [class.has-image]="previewUrl">
            <img *ngIf="previewUrl" [src]="previewUrl" alt="Preview">
            <div *ngIf="!previewUrl" class="upload-placeholder">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <p>Click to select photo</p>
              <span class="hint">JPG, PNG or WebP (Max 5MB)</span>
            </div>
          </div>

          <button
            *ngIf="previewUrl"
            type="button"
            class="remove-btn"
            (click)="removeImage()"
          >
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>

      <!-- Form Fields -->
      <div class="form-fields">

        <!-- Username -->
        <div class="form-group">
          <label for="username" class="form-label">Coach Name *</label>
          <input
            type="text"
            id="username"
            class="form-control"
            [(ngModel)]="formData.username"
            name="username"
            placeholder="e.g., Ahmed Mohamed"
            required
          >
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email *</label>
          <input
            type="email"
            id="email"
            class="form-control"
            [(ngModel)]="formData.email"
            name="email"
            placeholder="coach@gym.com"
            required
          >
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password *</label>
          <input
            type="password"
            id="password"
            class="form-control"
            [(ngModel)]="formData.password"
            name="password"
            placeholder="Enter a strong password"
            required
          >
          <small class="form-hint">Minimum 6 characters</small>
        </div>

        <!-- Phone (Optional) -->
        <div class="form-group">
          <label for="phone" class="form-label">Phone Number</label>
          <input
            type="tel"
            id="phone"
            class="form-control"
            [(ngModel)]="formData.phone"
            name="phone"
            placeholder="+20 10 123 45678"
          >
          <small class="form-hint">Optional</small>
        </div>

        <!-- Salary (Optional) -->
        <div class="form-group">
          <label for="salary" class="form-label">Salary</label>
          <input
            type="number"
            id="salary"
            class="form-control"
            [(ngModel)]="formData.salary"
            name="salary"
            placeholder="5000"
          >
          <small class="form-hint">Optional - Local currency</small>
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="form-actions">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="resetForm()"
        >
          <i class="fa-solid fa-rotate-left"></i>
          Reset Form
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isLoading"
        >
          <i class="fa-solid fa-check" *ngIf="!isLoading"></i>
          <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
          {{ isLoading ? 'Adding Coach...' : 'Add Coach' }}
        </button>
      </div>

    </form>
  </div>

  <!-- Success Toast -->
  <div class="toast success-toast" *ngIf="showSuccessToast">
    <i class="fa-solid fa-check-circle"></i>
    <span>{{ successMessage }}</span>
  </div>

  <!-- Error Toast -->
  <div class="toast error-toast" *ngIf="showErrorToast">
    <i class="fa-solid fa-exclamation-circle"></i>
    <span>{{ errorMessage }}</span>
  </div>

</div>
